# Builds the Windows and macOS packages for a version tag and attaches them to ONE draft GitHub release
# whose notes are the matching section of CHANGELOG.md. Publishing the draft is the manual step; the website
# and the in-app updater pick the release up once it is published.
#
# Trigger: `git push origin vX.Y.Z`. A manual run from the Actions tab only builds (artifacts, no release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The draft is created once, before the builds, so the two parallel electron-builder runs both upload into
  # the same release instead of racing to create their own.
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the draft with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          # Lines of the "## <version> ..." section of CHANGELOG.md, without the heading.
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ ! -s notes.md ]; then echo "ServerSysOps $VERSION" > notes.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "ServerSysOps $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "ServerSysOps $VERSION" --notes-file notes.md
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft
    # Also run when the draft job was skipped (manual run on a branch).
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: --mac --x64 --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main
        run: npm run build

      - name: Package (and upload to the draft release on a tag)
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No certificates: never try to look one up (macOS) or sign (Windows).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish version-less copies for the website's permanent download links
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd release
          files=()
          for f in *_x64-setup.exe *_x64-portable.exe *_mac-arm64.dmg *_mac-x64.dmg; do
            [ -f "$f" ] || continue
            case "$f" in
              *_x64-setup.exe) n=ServerSysOps-setup.exe ;;
              *_x64-portable.exe) n=ServerSysOps-portable.exe ;;
              *_mac-arm64.dmg) n=ServerSysOps-mac-arm64.dmg ;;
              *_mac-x64.dmg) n=ServerSysOps-mac-x64.dmg ;;
            esac
            cp "$f" "$n"
            files+=("$n")
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - name: Keep the packages as workflow artifacts too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.zip
            release/*.yml
          if-no-files-found: error
