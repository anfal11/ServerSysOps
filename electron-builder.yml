appId: com.serversysops.app
productName: ServerSysOps
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ssh2/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ServerSysOps_${version}_${arch}-setup.${ext}
  icon: build/icon.ico
portable:
  artifactName: ServerSysOps_${version}_${arch}-portable.${ext}
nsis:
  # Uninstall-registry identity of the 0.2.x/0.3.0 'Central Server' installer (uuid v5 of its appId).
  # Keeping it lets the in-app update replace that install instead of adding a second app.
  guid: 289adea8-a466-5993-b2cc-1f2f63fe174c
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: ServerSysOps
# Built on GitHub's macOS runners by .github/workflows/release.yml (macOS packages cannot be produced on
# Windows). No Apple Developer ID yet: electron-builder skips signing (identity: null) and build/afterPack.js
# re-signs the bundle ad hoc so Gatekeeper shows "unidentified developer" rather than "damaged".
mac:
  category: public.app-category.developer-tools
  icon: build/icon@1024.png
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ServerSysOps_${version}_mac-${arch}.${ext}
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
dmg:
  title: ServerSysOps ${version}
  contents:
    - { x: 140, y: 190 }
    - { x: 420, y: 190, type: link, path: /Applications }
afterPack: build/afterPack.js
linux:
  target: [AppImage, deb, rpm]
  category: Development
# Self-update feed: upload release/latest.yml, the -setup.exe and its .blockmap to this folder on your
# website, then set the URL here (the installed app checks it on start when "Check for updates" is on).
# Installer, portable exe and latest.yml are published as GitHub Releases of this repository;
# the app's auto-updater and the website read from there.
publish:
  provider: github
  owner: anfal11
  repo: ServerSysOps
  # CI uploads into a draft release for the tag; publishing it (with notes) is the manual step.
  releaseType: draft
npmRebuild: false
