appId: com.centralserver.app
productName: Central Server
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ssh2/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: CentralServer_${version}_${arch}-setup.${ext}
  icon: build/icon.ico
portable:
  artifactName: CentralServer_${version}_${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Central Server
mac:
  category: public.app-category.developer-tools
  target: [dmg]
linux:
  target: [AppImage, deb, rpm]
  category: Development
# Self-update feed: upload release/latest.yml, the -setup.exe and its .blockmap to this folder on your
# website, then set the URL here (the installed app checks it on start when "Check for updates" is on).
# Installer, portable exe and latest.yml are published as GitHub Releases of this repository;
# the app's auto-updater and the website read from there.
publish:
  provider: github
  owner: anfal11
  repo: CentralServer
npmRebuild: false
