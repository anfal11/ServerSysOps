appId: com.servermate.app
productName: ServerMate
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ssh2/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  icon: build/icon.ico
portable:
  artifactName: ${productName}_${version}_${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: ServerMate
mac:
  category: public.app-category.developer-tools
  target: [dmg]
linux:
  target: [AppImage, deb, rpm]
  category: Development
# Self-update feed: upload release/latest.yml, the -setup.exe and its .blockmap to this folder on your
# website, then set the URL here (the installed app checks it on start when "Check for updates" is on).
# Releases (installer, portable exe, latest.yml) are published as GitHub Releases; the app's
# auto-updater checks the same place, so a new tag + release = automatic update for users.
publish:
  provider: github
  owner: anfal11
  repo: ServerMate
npmRebuild: false
