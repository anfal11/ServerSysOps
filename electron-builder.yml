appId: com.serversysops.app
productName: ServerSysOps
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - node_modules/ssh2/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ServerSysOps_${version}_${arch}-setup.${ext}
  icon: build/icon.ico
portable:
  artifactName: ServerSysOps_${version}_${arch}-portable.${ext}
nsis:
  # Uninstall-registry identity of the 0.2.x/0.3.0 'Central Server' installer (uuid v5 of its appId).
  # Keeping it lets the in-app update replace that install instead of adding a second app.
  guid: 289adea8-a466-5993-b2cc-1f2f63fe174c
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: ServerSysOps
mac:
  category: public.app-category.developer-tools
  target: [dmg]
linux:
  target: [AppImage, deb, rpm]
  category: Development
# Self-update feed: upload release/latest.yml, the -setup.exe and its .blockmap to this folder on your
# website, then set the URL here (the installed app checks it on start when "Check for updates" is on).
# Installer, portable exe and latest.yml are published as GitHub Releases of this repository;
# the app's auto-updater and the website read from there.
publish:
  provider: github
  owner: anfal11
  repo: ServerSysOps
npmRebuild: false
